name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The same build the deploy workflow runs, without the deploy.
      # --frozen-lockfile fails when package.json and yarn.lock disagree.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: |
          yarn build:index
          mv notes public/notes
          yarn build
