name: Build and Deploy

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # deploy-pages publishes the artifact to Pages
      id-token: write # deploy-pages authenticates with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Configure Pages ⚙️
        uses: actions/configure-pages@v6
        with:
          enablement: true # switches Pages from branch-based to Actions deployment

      - name: Install and Build 🔧
        run: |
          yarn
          yarn build:index
          mv notes public/notes
          yarn build

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v5
        with:
          path: www

      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5
